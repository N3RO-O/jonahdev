<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found · NeroSec</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#121214" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/nerosec.svg" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3322399863518049"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        --bg: #121214;
        --text: #f4f4f0;
        --muted: #a1a1aa;
        --line: rgba(255, 255, 255, 0.08);
        --accent: #d97757;
        --ink: #121214;
        --sans: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
        --serif: "Instrument Serif", Georgia, "Times New Roman", serif;
        --mono: "DM Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      * {
        box-sizing: border-box;
        margin: 0;
      }
      html,
      body {
        min-height: 100%;
      }
      body {
        background:
          radial-gradient(120% 60% at 50% -10%, rgba(217, 119, 87, 0.06), transparent 60%),
          var(--bg);
        color: var(--text);
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      body::after {
        content: "";
        position: fixed;
        inset: 0;
        pointer-events: none;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.04'/%3E%3C/svg%3E");
        background-size: 180px 180px;
      }
      a {
        color: inherit;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 6px;
      }
      .page {
        width: min(1328px, calc(100% - 44px));
        min-height: 100vh;
        margin-inline: auto;
        display: flex;
        flex-direction: column;
      }
      header,
      footer {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 20px;
        padding-block: 26px;
        border-bottom: 1px solid var(--line);
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.06em;
        color: var(--muted);
      }
      footer {
        border-bottom: 0;
        border-top: 1px solid var(--line);
      }
      .brand {
        display: inline-flex;
        align-items: center;
        gap: 9px;
        font-family: var(--sans);
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.05em;
        color: var(--text);
      }
      .brand svg {
        width: 26px;
        height: 26px;
        color: var(--accent);
      }
      main {
        flex: 1;
        display: grid;
        align-content: center;
        gap: 34px;
        padding-block: 60px;
      }
      .eyebrow {
        font-family: var(--mono);
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--muted);
      }
      .eyebrow b {
        color: var(--accent);
        font-weight: 400;
      }
      h1 {
        font-size: clamp(58px, 11vw, 168px);
        line-height: 0.92;
        font-weight: 550;
        letter-spacing: -0.07em;
      }
      h1 em {
        font-family: var(--serif);
        font-weight: 400;
        letter-spacing: -0.02em;
        color: var(--accent);
        font-size: 1.12em;
      }
      .console {
        max-width: 620px;
        border: 1px solid rgba(255, 255, 255, 0.12);
        background: linear-gradient(180deg, #1b1b1e, #151517);
        font-family: var(--mono);
        font-size: 14px;
        line-height: 1.9;
        padding: 18px 22px;
        overflow-wrap: anywhere;
      }
      .console p {
        color: var(--muted);
      }
      .console .prompt {
        color: var(--accent);
      }
      .console .cmd {
        color: var(--text);
      }
      .caret {
        display: inline-block;
        width: 8px;
        height: 15px;
        vertical-align: -2px;
        background: var(--accent);
        animation: blink 1.1s steps(1) infinite;
      }
      @keyframes blink {
        50% {
          opacity: 0;
        }
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 28px;
        align-items: center;
      }
      .button {
        display: inline-flex;
        align-items: center;
        gap: 30px;
        min-height: 48px;
        padding: 14px 20px;
        background: var(--text);
        color: var(--ink);
        font-size: 14px;
        transition:
          background 0.2s,
          transform 0.2s;
      }
      .button:hover {
        background: var(--accent);
        transform: translateY(-2px);
      }
      .text-link {
        font-size: 14px;
        padding-block: 8px;
        border-bottom: 1px solid #5e5c56;
        transition: color 0.2s;
      }
      .text-link:hover {
        color: var(--accent);
      }
      @media (prefers-reduced-motion: reduce) {
        .caret {
          animation: none;
        }
        .button {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/" aria-label="NeroSec home">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" aria-hidden="true">
            <path d="M12 6v12M17.196 9 6.804 15M6.804 9l10.392 6" />
          </svg>
          NeroSec
        </a>
        <span>Error / 404</span>
      </header>
      <main>
        <span class="eyebrow"><b>404 /</b> Off the map</span>
        <h1>This page<br />took <em>a detour.</em></h1>
        <div class="console" role="note" aria-label="NeroSec System Console">
          <p><span class="prompt">nerosec ~ $</span> <span class="cmd">cd <span id="path">this page</span></span></p>
          <p>No such page. Try the work, the archive, or say hello.</p>
          <p><span class="prompt">nerosec ~ $</span> <span class="caret" aria-hidden="true"></span></p>
        </div>
        <div class="actions">
          <a class="button" href="/">Back to the homepage <span aria-hidden="true">↗</span></a>
          <a class="text-link" href="/#projects">See selected work</a>
          <a class="text-link" href="/#project-index">Browse the archive</a>
          <a class="text-link" href="/#contact">Get in touch</a>
        </div>
      </main>
      <footer>
        <span>© NeroSec — Jonah Mark Tabuzo</span>
        <span>Made in the Philippines</span>
      </footer>
    </div>
    <script>
      // textContent keeps the requested path inert (no HTML injection).
      var requested = window.location.pathname || "/";
      try {
        requested = decodeURIComponent(requested);
      } catch (error) {}
      document.getElementById("path").textContent = requested;
    </script>
  </body>
</html>
