<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 — Page not found · Nero</title>
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" type="image/svg+xml" href="/assets/icons/nero.svg" />
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-3322399863518049"
      crossorigin="anonymous"
    ></script>
    <style>
      :root {
        --bg: #ffffff; --ink: #0a0a0a; --muted: #5c5c63; --line: rgba(10, 10, 10, 0.1);
        --soft: #f2f2f2; --red: #d81111;
        --sans: "Tomorrow", system-ui, -apple-system, "Segoe UI", sans-serif;
        --pixel: "VT323", ui-monospace, "SFMono-Regular", Menlo, monospace;
        --mono: ui-monospace, "SFMono-Regular", Menlo, monospace;
      }
      * { box-sizing: border-box; margin: 0; }
      body { min-height: 100vh; background: var(--bg); color: var(--ink); font-family: var(--sans); -webkit-font-smoothing: antialiased; }
      a { color: inherit; text-decoration: none; }
      a:focus-visible { outline: 2px solid var(--red); outline-offset: 4px; border-radius: 6px; }
      .page { width: min(1280px, calc(100% - 32px)); min-height: 100vh; margin-inline: auto; display: flex; flex-direction: column; }
      header, footer { display: flex; align-items: center; justify-content: space-between; gap: 20px; padding-block: 20px;
        font-family: var(--mono); font-size: 12px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
      footer { border-top: 1px solid var(--line); }
      .brand { display: inline-flex; align-items: center; gap: 10px; font-family: var(--sans); font-weight: 600; font-size: 24px;
        letter-spacing: -0.04em; color: var(--ink); }
      .brand img { width: 34px; height: 34px; border-radius: 8px; }
      main { flex: 1; display: grid; align-content: center; gap: 28px; padding-block: 48px; }
      .code { font-family: var(--pixel); font-size: clamp(120px, 26vw, 320px); line-height: 0.8; color: var(--red); }
      h1 { font-size: clamp(40px, 6vw, 84px); font-weight: 500; line-height: 1; letter-spacing: -0.07em; text-transform: uppercase; }
      .console { max-width: 620px; padding: 16px 20px; border-radius: 14px; background: var(--ink); color: #b9b9be;
        font-family: var(--mono); font-size: 14px; line-height: 1.9; overflow-wrap: anywhere; }
      .prompt { color: #ff6b6b; }
      .cmd { color: #fff; }
      .caret { display: inline-block; width: 8px; height: 15px; vertical-align: -2px; background: #ff6b6b; animation: blink 1.1s steps(1) infinite; }
      @keyframes blink { 50% { opacity: 0; } }
      .actions { display: flex; flex-wrap: wrap; gap: 10px; }
      .button { display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 12px 20px; border-radius: 10px;
        font-size: 14px; font-weight: 500; text-transform: uppercase; letter-spacing: 0.02em; border: 1px solid var(--ink); transition: background 0.2s, color 0.2s; }
      .button:hover { background: var(--ink); color: #fff; }
      .button.red { background: var(--red); border-color: var(--red); color: #fff; }
      .button.red:hover { background: #a70d0d; }
      @media (prefers-reduced-motion: reduce) { .caret { animation: none; } }
    </style>
  </head>
  <body>
    <div class="page">
      <header>
        <a class="brand" href="/" aria-label="Nero home">
          <img src="/assets/brand/nero-mark.svg" alt="" />
          NERO
        </a>
        <span>Error / 404</span>
      </header>
      <main>
        <span class="code" aria-hidden="true">404</span>
        <h1>This page took a detour.</h1>
        <div class="console" role="note" aria-label="Nero System Console">
          <p><span class="prompt">nero ~ $</span> <span class="cmd">cd <span id="path">this page</span></span></p>
          <p>No such page. Try the work, the archive, or say hello.</p>
          <p><span class="prompt">nero ~ $</span> <span class="caret" aria-hidden="true"></span></p>
        </div>
        <div class="actions">
          <a class="button red" href="/">Back to the homepage ↗</a>
          <a class="button" href="/#projects">Selected work</a>
          <a class="button" href="/#project-index">The archive</a>
          <a class="button" href="/#contact">Get in touch</a>
        </div>
      </main>
      <footer>
        <span>© Nero — Jonah Mark Tabuzo</span>
        <span>Made in the Philippines</span>
      </footer>
    </div>
    <script>
      // textContent keeps the requested path inert (no HTML injection).
      var requested = window.location.pathname || "/";
      try {
        requested = decodeURIComponent(requested);
      } catch (error) {}
      document.getElementById("path").textContent = requested;
    </script>
  </body>
</html>
